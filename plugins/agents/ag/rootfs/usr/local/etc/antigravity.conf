# Names, URLs and paths that Google's Antigravity IDE and agy define and
# the ag plugin depends on. Sourced by gravity-cli, the startup hook and
# chrome-cleanup.sh. The `ide` verb hot-injects it with gravity-cli, so a
# sandbox from an older image updates with the same values a fresh image
# builds with.
#
# Each section heading names the oldest IDE version its entries are known
# to hold for, and sections are sorted by it. An entry that stops holding
# from some version on moves to a section whose heading gives the range.
# Values only, no logic. Paths that start with a dot are relative to the
# user's home.

## IDE 1.x

# Electron names the user-data dir after product.json's nameLong. Home
# volumes from before the 2.x layer still carry 1.x's.
AG_1X_USER_DATA=".config/Antigravity"

## IDE 2.5.5+

# <base>/<version>-<build id>/<platform path>/<tarball> names one build
# for good: the objects are write-once and no floating "latest" path
# exists.
AG_DOWNLOAD_BASE=https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable
AG_TARBALL="Antigravity IDE.tar.gz"
# <api>/api/update/<platform api>/stable/latest -> the current build's
# URL and the sha256 Google publishes for it.
AG_UPDATER_API=https://antigravity-ide-auto-updater-974169037036.us-central1.run.app
# The download path and the updater API spell arm64 differently; both
# tarballs are aarch64.
AG_PLATFORM_PATH_amd64=linux-x64
AG_PLATFORM_PATH_arm64=linux-arm
AG_PLATFORM_API_amd64=linux-x64
AG_PLATFORM_API_arm64=linux-arm64
# The tarball's layout, relative to its top directory.
AG_BINARY=antigravity-ide
AG_CLI_SHIM=bin/antigravity-ide
AG_CLI_JS=resources/app/out/cli.js
AG_ICON=resources/app/resources/linux/code.png
AG_PRODUCT_JSON=resources/app/product.json
# product.json keys naming the IDE's own update server.
AG_UPDATE_KEYS="updateUrl backupUpdateUrl"
AG_USER_DATA=".config/Antigravity IDE"
AG_URL_SCHEME=antigravity-ide

## IDE 2.6.0+ (agy 1.4.8+ as the Agent Manager backend)

# <base>/<version>-<build id>/<platform path>/<agy file>
AGY_DOWNLOAD_BASE=https://storage.googleapis.com/antigravity-public/antigravity-cli
# <api>/manifests/<agy manifest>.json -> version, URL and sha512; the
# manifest the IDE's agy extension reads.
AGY_UPDATER_API=https://antigravity-cli-auto-updater-974169037036.us-central1.run.app
AGY_FILE_amd64=cli_linux_x64.tar.gz
AGY_FILE_arm64=cli_linux_arm64.tar.gz
AGY_MANIFEST_amd64=linux_amd64
AGY_MANIFEST_arm64=linux_arm64
# The one file in the agy tarball.
AGY_TARBALL_MEMBER=antigravity
# Where the IDE runs agy from.
AGY_HOME_BIN=.gemini/bin/agy
# The agent browser's --user-data-dir.
AG_BROWSER_PROFILE=.gemini/antigravity-browser-profile
# The agy extension's code, relative to the IDE's install dir.
AGY_EXTENSION_MAIN=resources/app/extensions/agy/vscode/extension.js
# The extension reads this variable before any setting. It accepts plain
# http for loopback only, and port 9 (discard) refuses at once, so the
# update check fails in milliseconds and the extension keeps the agy it
# found.
AGY_RELEASE_ENV=AGY_RELEASE_BASE_URL
AGY_RELEASE_OFF=http://127.0.0.1:9

## IDE 2.8.0+

# A background download the agy extension stages beside AGY_HOME_BIN and
# swaps in on the next start.
AGY_STAGED_NEXT=.gemini/bin/agy.next
