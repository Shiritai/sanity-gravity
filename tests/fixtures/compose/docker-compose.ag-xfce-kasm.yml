services:
  ag-xfce-kasm:
    image: ${SANITY_IMAGE_AG_XFCE_KASM:-sanity-gravity:ag-xfce-kasm}
    command:
    - /usr/bin/supervisord
    - -c
    - /etc/supervisor/supervisord.conf
    environment:
    - HOST_UID=${HOST_UID:-1000}
    - HOST_GID=${HOST_GID:-1000}
    - HOST_USER=${HOST_USER:-developer}
    - HOST_PASSWORD=${HOST_PASSWORD:-antigravity}
    volumes:
    - sg_ag-xfce-kasm:/home/${HOST_USER:-developer}
    - ${WORKSPACE_DIR:-./workspace}:/home/${HOST_USER:-developer}/workspace
    ports:
    - ${KASM_PORT:-8444}:8444
    - ${SSH_HOST_PORT:-2222}:22
    network_mode: bridge
    shm_size: 512m
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - KILL
    - SETGID
    - SETUID
    - NET_BIND_SERVICE
    - SYS_CHROOT
    - AUDIT_WRITE
    pids_limit: 2048
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      core:
        soft: 0
        hard: 0
    labels:
      sanity.gravity.managed: 'true'
      sanity.gravity.home-volume: 'true'
volumes:
  sg_ag-xfce-kasm:
    name: sg-${COMPOSE_PROJECT_NAME:-sanity-gravity}-ag-xfce-kasm
