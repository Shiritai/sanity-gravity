services:
  cc-none-ssh:
    image: ${SANITY_IMAGE_CC_NONE_SSH:-sanity-gravity:cc-none-ssh}
    command:
    - /usr/bin/supervisord
    - -c
    - /etc/supervisor/supervisord.conf
    environment:
    - HOST_UID=${HOST_UID:-1000}
    - HOST_GID=${HOST_GID:-1000}
    - HOST_USER=${HOST_USER:-developer}
    - HOST_PASSWORD=${HOST_PASSWORD:-antigravity}
    volumes:
    - sg_cc-none-ssh:/home/${HOST_USER:-developer}
    - ${WORKSPACE_DIR:-./workspace}:/home/${HOST_USER:-developer}/workspace
    ports:
    - ${SSH_HOST_PORT:-2222}:22
    network_mode: bridge
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - KILL
    - SETGID
    - SETUID
    - NET_BIND_SERVICE
    - SYS_CHROOT
    - AUDIT_WRITE
    pids_limit: 2048
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      core:
        soft: 0
        hard: 0
    labels:
      sanity.gravity.managed: 'true'
      sanity.gravity.home-volume: 'true'
volumes:
  sg_cc-none-ssh:
    name: sg-${COMPOSE_PROJECT_NAME:-sanity-gravity}-cc-none-ssh
