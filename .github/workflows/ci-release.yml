name: Release Pipeline

# Version tags are the only publish trigger. Publishing a GitHub release
# creates its tag, and that tag push runs this workflow; a `release`
# trigger as well would build and publish the same version twice.
# GitHub does not apply paths-ignore to tag pushes.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'README.md'
      - 'README_*.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'SECURITY.md'
      - 'assets/**'
      - 'docs/**'

permissions:
  contents: read
  packages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      tags_csv: ${{ steps.vars.outputs.tags_csv }}
      tags_json: ${{ steps.meta.outputs.tags_json }}
      repo_lc: ${{ steps.lowercase.outputs.repo_lc }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - id: lowercase
        run: echo "repo_lc=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Discover valid tags from sanity-cli
        id: meta
        run: |
          chmod +x ./sanity-cli
          echo "tags_json=$(./sanity-cli list --json)" >> $GITHUB_OUTPUT

      - name: Generate publish tag metadata
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "short_sha=${SHA_SHORT}" >> $GITHUB_OUTPUT

          TAG_LIST="sha-${SHA_SHORT}"
          REF_NAME="${{ github.ref_name }}"
          if [[ "${{ github.ref_type }}" == "tag" && "${REF_NAME}" == v* ]]; then
            TAG_LIST="${TAG_LIST},${REF_NAME}"
            # A pre-release (v1.2.0-rc.1) is published under its own name
            # only; latest is what README users pull.
            if [[ "${REF_NAME}" != *-* ]]; then
              TAG_LIST="${TAG_LIST},latest"
            fi
          fi
          echo "tags_csv=${TAG_LIST}" >> $GITHUB_OUTPUT

  build-x64:
    needs: [setup]
    uses: ./.github/workflows/_build.yml
    with:
      arch: amd64
      repo_lc: ${{ needs.setup.outputs.repo_lc }}
      tag: sha-${{ needs.setup.outputs.short_sha }}
    secrets: inherit

  build-arm64:
    needs: [setup]
    uses: ./.github/workflows/_build.yml
    with:
      arch: arm64
      repo_lc: ${{ needs.setup.outputs.repo_lc }}
      tag: sha-${{ needs.setup.outputs.short_sha }}
    secrets: inherit

  check-x64:
    needs: [setup, build-x64]
    uses: ./.github/workflows/_check.yml
    with:
      arch: amd64
      repo_lc: ${{ needs.setup.outputs.repo_lc }}
      tag: sha-${{ needs.setup.outputs.short_sha }}
      tags: ${{ needs.setup.outputs.tags_json }}
    secrets: inherit

  check-arm64:
    needs: [setup, build-arm64]
    uses: ./.github/workflows/_check.yml
    with:
      arch: arm64
      repo_lc: ${{ needs.setup.outputs.repo_lc }}
      tag: sha-${{ needs.setup.outputs.short_sha }}
      tags: ${{ needs.setup.outputs.tags_json }}
    secrets: inherit

  test-x64:
    needs: [setup, build-x64]
    uses: ./.github/workflows/_test.yml
    with:
      arch: amd64
      repo_lc: ${{ needs.setup.outputs.repo_lc }}
      tag: sha-${{ needs.setup.outputs.short_sha }}
      tags: ${{ needs.setup.outputs.tags_json }}
    secrets: inherit

  test-arm64:
    needs: [setup, build-arm64]
    uses: ./.github/workflows/_test.yml
    with:
      arch: arm64
      repo_lc: ${{ needs.setup.outputs.repo_lc }}
      tag: sha-${{ needs.setup.outputs.short_sha }}
      tags: ${{ needs.setup.outputs.tags_json }}
    secrets: inherit

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [setup, test-x64, test-arm64, check-x64, check-arm64]
    uses: ./.github/workflows/_publish.yml
    with:
      repo_lc: ${{ needs.setup.outputs.repo_lc }}
      transient_tag: sha-${{ needs.setup.outputs.short_sha }}
      tags_csv: ${{ needs.setup.outputs.tags_csv }}
      image_tags: ${{ needs.setup.outputs.tags_json }}
    secrets: inherit
