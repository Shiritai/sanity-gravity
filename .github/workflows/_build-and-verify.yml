name: "Build + Verify (PR)"

on:
  workflow_call:
    inputs:
      arch:
        description: "Target architecture (amd64 or arm64)"
        required: true
        type: string
      tags:
        description: "JSON array of final image tags"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build all images
        run: chmod +x ./sanity-cli && ./sanity-cli build all

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y socat
          pip install -e ".[test]"

      - name: Run integration tests
        env:
          SANITY_REQUIRE_IMAGES: "1" # a skipped image test here means `build all` produced nothing
        run: ./sanity-cli test

      - name: Install Trivy CLI
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Security scan all images
        run: |
          FAILED=0
          for tag in $(echo '${{ inputs.tags }}' | jq -r '.[]'); do
            echo "::group::Scanning ${tag}"
            # The Antigravity IDE ships as a vendor-bundled Electron/VS Code
            # fork: resources/app carries npm packages we neither choose nor
            # can patch, so the only fix is a newer IDE build - which is what
            # the version pin in plugins/agents/ag/Dockerfile is for. OS
            # packages and the rest of every image stay in scope, and images
            # without that directory are unaffected by the skip.
            trivy image --exit-code 1 --ignore-unfixed \
              --skip-dirs usr/share/antigravity-ide/resources/app \
              --pkg-types os,library --severity CRITICAL,HIGH \
              "sanity-gravity:${tag}" || FAILED=1
            echo "::endgroup::"
          done
          exit $FAILED
