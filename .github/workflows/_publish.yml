name: Reusable Publish

on:
  workflow_call:
    inputs:
      repo_lc:
        required: true
        type: string
      transient_tag:
        required: true
        type: string
      tags_csv:
        required: true
        type: string
      image_tags:
        required: true
        type: string
        description: "JSON array of final image tags to publish"

jobs:
  publish:
    name: Publish ${{ matrix.image_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image_tag: ${{ fromJson(inputs.image_tags) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote and Publish Multi-arch
        # The runner's docker pushes each per-arch image as an index (the
        # image plus its attestation), and `docker manifest create`
        # refuses an index as a source. imagetools merges the sources'
        # manifests into one index, registry-side, with no pull.
        run: |
          REPO_LC="${{ inputs.repo_lc }}"
          TRANSIENT_TAG="${{ inputs.transient_tag }}"
          VARIANT="${{ matrix.image_tag }}"
          IMAGE="ghcr.io/${REPO_LC}-${VARIANT}"

          IFS=',' read -ra TAGS <<< "${{ inputs.tags_csv }}"
          for FINAL_TAG in "${TAGS[@]}"; do
            echo "Creating manifest for ${VARIANT}:${FINAL_TAG}"
            docker buildx imagetools create -t "${IMAGE}:${FINAL_TAG}" \
              "${IMAGE}:${TRANSIENT_TAG}-amd64" \
              "${IMAGE}:${TRANSIENT_TAG}-arm64"

            # Persistent per-arch tags, so the transient ones can be
            # garbage-collected without losing what this tag points at.
            for arch in amd64 arm64; do
              docker buildx imagetools create -t "${IMAGE}:${FINAL_TAG}-${arch}" \
                "${IMAGE}:${TRANSIENT_TAG}-${arch}"
            done
          done
