name: PR Pipeline

on:
  pull_request:
    branches: [ main, feat/*, fix/* ]
    paths-ignore:
      - 'README.md'
      - 'README_*.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'SECURITY.md'
      - 'assets/**'
      - 'docs/**'

permissions:
  contents: read

jobs:
  # One runner, once per PR - lint never joins the per-tag/per-arch
  # fan-out, and a red here fails fast without blocking tag discovery.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Lint Tooling
        run: pip install -e ".[lint]"

      - name: Ruff
        run: ruff check .

      # Also embedded in the unit suite (test_architecture.py); this
      # step is the fast PR-time red for the same contracts.
      - name: Import Linter
        run: lint-imports

  setup:
    runs-on: ubuntu-latest
    outputs:
      tags_json: ${{ steps.meta.outputs.tags_json }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Discover valid tags from sanity-cli
        id: meta
        run: |
          chmod +x ./sanity-cli
          echo "tags_json=$(./sanity-cli list --json)" >> $GITHUB_OUTPUT

  verify-x64:
    needs: [setup]
    uses: ./.github/workflows/_build-and-verify.yml
    with:
      arch: amd64
      tags: ${{ needs.setup.outputs.tags_json }}

  verify-arm64:
    needs: [setup]
    uses: ./.github/workflows/_build-and-verify.yml
    with:
      arch: arm64
      tags: ${{ needs.setup.outputs.tags_json }}
