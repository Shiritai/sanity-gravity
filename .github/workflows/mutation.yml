name: Mutation Testing

# Observational only - never wired into PR checks. Surviving mutants
# never fail the job (the results artifact is the signal); a run that
# could not check any mutant does. If survivors ever become a gate it
# will be a frozen survivor allowlist that may only shrink (same shape
# as the repo's other ratchets), never a floating score threshold.
on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 03:17 UTC (offset to dodge top-of-hour load).
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install
        run: |
          pip install -e ".[test]"
          pip install -e ".[mutation]"

      - name: Run mutation testing
        # mutmut exits 0 whether or not mutants survive and nonzero
        # only when it cannot test them (stats or clean run failing,
        # forced-fail check passing, a crash), so a red step means the
        # run is broken, never that mutants survived.
        run: mutmut run

      - name: Collect results
        if: always()
        run: mutmut results | tee mutmut-results.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutmut-results
          path: mutmut-results.txt
